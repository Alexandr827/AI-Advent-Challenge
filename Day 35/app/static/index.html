<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спецификация</title>
  <link rel="stylesheet" href="/static/styles.css?v=20">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 3.5h7.2L14.5 6.8V14.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4"/>
            <path d="M11 3.5V7h3.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6 10h6M6 12.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <div>
          <p class="eyebrow">Спецификация</p>
          <h1>Черновик технического задания</h1>
        </div>
      </div>
      <nav class="menu" aria-label="Профиль и сессии">
        <label class="menu-profile">Профиль
          <select id="menu-profile"></select>
        </label>
        <button id="new-window" type="button" class="ghost">Новое окно</button>
        <button id="clear-session" type="button" class="ghost" disabled>Очистить</button>
      </nav>
      <p id="status" class="status" aria-live="polite">Нет сессии</p>
    </header>

    <section id="gate" class="gate">
      <form id="start-form" class="gate-card">
        <div class="gate-copy">
          <h2>Новое техническое задание</h2>
          <p>Опишите фичу. Агент соберёт каркас и черновик разделов, а правки пойдут в диалог.</p>
        </div>
        <label>Профиль
          <select id="profile-select"></select>
        </label>
        <label>Новый профиль
          <input id="profile-name" type="text" placeholder="Имя автора" autocomplete="off">
        </label>
        <label>Как писать
          <textarea id="writing-note" rows="2" placeholder="Коротко, с критериями приёмки"></textarea>
        </label>
        <label>Фича
          <textarea id="feature" rows="3" required placeholder="Что нужно сделать"></textarea>
        </label>
        <label>Проект
          <input id="project" type="text" placeholder="Название проекта">
        </label>
        <button type="submit">Начать</button>
      </form>
    </section>

    <main id="work" class="work" hidden>
      <section class="chat" aria-label="Диалог">
        <header class="chat-head">
          <h2>Диалог</h2>
          <div class="chat-meta">
            <p id="chat-status" class="chat-status"></p>
            <p id="token-status" class="token-status"></p>
          </div>
        </header>
        <div class="thread">
          <div id="feed" class="feed" aria-label="Лента агента"></div>
          <div id="thinking-banner" class="thinking-row" hidden>
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>Агент думает</span>
            <button id="stop" type="button">Остановить</button>
          </div>
        </div>
        <footer id="composer" class="composer" hidden>
          <p id="section-target" class="target"></p>
          <div class="composer-box">
            <textarea id="message" rows="2" placeholder="Ответ агенту или замечание к разделу"></textarea>
            <button id="send" type="button">Отправить</button>
          </div>
          <p class="hint">Enter — отправить, Shift+Enter — новая строка</p>
        </footer>
      </section>

      <section class="document" aria-label="Документ">
        <div class="doc-wrap">
          <header class="doc-head">
            <h2>Документ</h2>
          </header>
          <div class="doc-toolbar">
            <div class="actions">
              <button id="validate" type="button">Проверить</button>
              <button id="done" type="button">Готово</button>
              <button id="diff-btn" type="button" class="ghost">Diff</button>
              <a id="download" class="ghost" href="#">Markdown</a>
              <button id="save-example" type="button" class="ghost">В примеры</button>
              <button id="cancel" type="button" class="ghost">Отменить</button>
            </div>
            <div class="actions">
              <label class="file">Требования <input id="req-file" type="file"></label>
              <label class="file">Каркас <input id="skel-file" type="file"></label>
              <label class="file">Пример <input id="ex-file" type="file"></label>
              <label class="file">Запись <input id="audio-file" type="file" accept="audio/*"></label>
            </div>
            <form id="repo-form" class="repo">
              <input id="repo-path" type="text" placeholder="Путь к репозиторию">
              <button type="submit" class="ghost">Подключить</button>
            </form>
          </div>
          <div id="choice"></div>
          <div id="proposal"></div>
          <div id="sections"></div>
          <div id="skeleton"></div>
          <pre id="diff" class="diff" hidden></pre>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/app.js?v=20"></script>
</body>
</html>
